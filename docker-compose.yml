version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "9005:8005"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cars_db
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cars_db
    ports:
      - "5432:5432"